<!DOCTYPE html>
<html>
<head>
  <title>Product Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="navbar">
    <a href="#">Home</a>
    <a href="#">Shop</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </div>

  <div class="card">
    <div class="badge">-30%</div>

    <div class="image-box">
      <img src="https://avantree.com/cdn/shop/files/vhs-as90r-m1-s.webp?v=1776937044" alt="Aria Wireless Headphones" class="product-img">
    </div>

    <div class="content">
      <h2>Aria Wireless Headphones</h2>
      <p>Active noise-cancelling, plush earcups, and 30 hours of battery life on a single charge.</p>

      <p class="price-line">
        <span class="price">$69.99</span>
        <span class="old-price">$99.99</span>
      </p>

      <button class="btn btn-cart">Add to Cart</button>
      <button class="btn btn-wish">Add to Wishlist</button>
    </div>
  </div>

  <div class="stock">
    &#9888; Only 3 left in stock
  </div>

</body>
</html>
